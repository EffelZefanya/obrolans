<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Obrolans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF6EF;
  --ink:#2B2620;
  --ink-soft:#6b6257;
  --card-back:#3a3229;
  --shadow:rgba(43,38,32,.10);
  --accent:#6B8F71;
  --line:rgba(43,38,32,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --paper:#211d18; --ink:#f1ece2; --ink-soft:#a89e8f; --card-back:#141210; --shadow:rgba(0,0,0,.35); --line:rgba(241,236,226,.14); }
}
:root[data-theme="dark"]{ color-scheme:dark; --paper:#211d18; --ink:#f1ece2; --ink-soft:#a89e8f; --card-back:#141210; --shadow:rgba(0,0,0,.35); --line:rgba(241,236,226,.14); }

*{ box-sizing:border-box; }
html,body{ min-height:100%; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:28px 18px 40px;
}
h1{
  font-family:'Fraunces',Georgia,serif; font-weight:600;
  font-size:clamp(28px,7vw,38px); margin:4px 0 2px; letter-spacing:-0.01em;
}
.tagline{ color:var(--ink-soft); font-size:14px; margin:0 0 28px; text-align:center; max-width:340px; text-wrap:balance; }
.screen{ width:100%; display:flex; flex-direction:column; align-items:center; }
[hidden]{ display:none !important; }

/* Home: audience cards */
.cat-grid{ display:flex; flex-direction:column; gap:14px; width:min(360px,100%); }
.cat-card{
  border:1.5px solid var(--cat-color); border-radius:18px; padding:20px;
  text-align:left; cursor:pointer; background:var(--paper); color:inherit; font:inherit;
  box-shadow:0 6px 20px var(--shadow);
  transition:transform .12s ease;
}
.cat-card:hover{ transform:translateY(-2px); }
.cat-card:focus-visible{ outline:2px solid var(--cat-color); outline-offset:2px; }
.cat-title{ font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:19px; margin-bottom:4px; color:var(--cat-color); }
.cat-desc{ font-size:13px; color:var(--ink-soft); line-height:1.45; }
.cat-meta{ font-size:12px; color:var(--ink-soft); margin-top:8px; }

/* Deck list screen */
.topbar{ width:min(420px,100%); margin-bottom:6px; }
.back-btn{ background:none; border:none; color:var(--ink-soft); font:13px 'Inter',system-ui,sans-serif; cursor:pointer; padding:6px 0; }
.back-btn:hover{ color:var(--ink); }

.depth-filter{ display:flex; gap:6px; justify-content:center; margin:2px 0 14px; }
.tier-btn{
  border:1.5px solid var(--ink-soft); background:transparent; color:var(--ink-soft);
  font:600 13px 'Inter',system-ui,sans-serif;
  padding:6px 16px; border-radius:999px; cursor:pointer; transition:all .15s ease;
}
.tier-btn[data-active="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

.deck-list{ display:flex; flex-direction:column; gap:10px; width:min(420px,100%); }
.group-label{ font-size:12px; font-weight:600; color:var(--ink-soft); margin:10px 2px 0; }
.deck-card{
  border:1.5px solid var(--line); border-left:5px solid var(--deck-color); border-radius:14px;
  padding:14px 16px; text-align:left; cursor:pointer; background:var(--paper); color:inherit; font:inherit;
  box-shadow:0 4px 14px var(--shadow); transition:transform .12s ease;
}
.deck-card:hover{ transform:translateY(-2px); }
.deck-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.deck-name{ font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:17px; color:var(--ink); }
.deck-count{ font-size:12px; color:var(--ink-soft); white-space:nowrap; font-variant-numeric:tabular-nums; }
.deck-desc{ font-size:13px; color:var(--ink-soft); line-height:1.45; margin-top:3px; }
.deck-meta{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
.badge{ font-size:11px; font-weight:600; padding:2px 9px; border-radius:999px; border:1px solid var(--ink-soft); color:var(--ink-soft); }
.badge.dalam{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
.badge.tag{ border-style:dashed; border-color:var(--deck-color); color:var(--deck-color); }

/* Play screen */
.crumb{ font-size:13px; color:var(--ink-soft); margin:0 0 18px; text-align:center; }
.crumb b{ color:var(--ink); font-weight:600; }

.stage{ perspective:1200px; width:min(320px,100%); height:420px; margin-bottom:26px; }
.card{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.4,.2,.2,1); cursor:pointer; }
.card[data-flipped="true"]{ transform:rotateY(180deg); }
.face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; text-align:center; box-shadow:0 10px 30px var(--shadow); }
.face.back{ background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.06), transparent 60%), var(--card-back); color:#e9e2d4; }
.back .mark{ font-family:'Fraunces',Georgia,serif; font-style:italic; font-size:22px; border:1px solid rgba(233,226,212,.35); border-radius:999px; padding:10px 22px; }
.back .hint{ margin-top:14px; font-size:12px; letter-spacing:.02em; color:rgba(233,226,212,.6); }
.face.front{ background:var(--paper); border:1.5px solid var(--deck-color, var(--accent)); transform:rotateY(180deg); }
.front .deck-label{ font-size:12px; font-weight:600; color:var(--deck-color, var(--accent)); margin-bottom:16px; }
.front .question{ font-family:'Fraunces',Georgia,serif; font-weight:500; font-size:clamp(19px,4.6vw,23px); line-height:1.4; color:var(--ink); text-wrap:balance; }
.front .wild{
  font-size:13px; font-weight:600; line-height:1.4; color:var(--deck-color, var(--accent));
  border:1.5px dashed var(--deck-color, var(--accent)); border-radius:12px;
  padding:8px 12px; margin-bottom:16px; max-width:100%;
}
.front .wild b{ display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:2px; }
.front .followup{ margin-top:18px; font-family:'Fraunces',Georgia,serif; font-style:italic; font-size:15px; color:var(--ink-soft); }
.front .num{ position:absolute; bottom:18px; right:20px; font-size:11px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }

.primary{
  font:600 15px 'Inter',system-ui,sans-serif; color:#fff;
  background:var(--accent); border:none; padding:14px 26px; border-radius:12px; cursor:pointer;
  transition:filter .15s ease, transform .1s ease;
}
.primary:hover{ filter:brightness(1.08); }
.primary:active{ transform:scale(.97); }
.primary:focus-visible, .deck-card:focus-visible, .tier-btn:focus-visible, .back-btn:focus-visible, .card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.count{ margin-top:14px; font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
@media (prefers-reduced-motion: reduce){ .card, .cat-card, .deck-card{ transition:none; } }
</style>

<h1>Obrolans</h1>
<p class="tagline" id="tagline"></p>

<section class="screen" id="homeScreen">
  <div class="cat-grid" id="audienceGrid"></div>
</section>

<section class="screen" id="deckScreen" hidden>
  <div class="topbar"><button class="back-btn" id="homeBtn" type="button">← Ganti kategori</button></div>
  <div class="depth-filter" id="depthFilter" role="group" aria-label="Kedalaman"></div>
  <div class="deck-list" id="deckList"></div>
</section>

<section class="screen" id="playScreen" hidden>
  <div class="topbar"><button class="back-btn" id="decksBtn" type="button">← Ganti dek</button></div>
  <div class="crumb" id="crumb"></div>
  <div class="stage">
    <div class="card" id="card" data-flipped="false" tabindex="0" role="button" aria-label="Balik kartu">
      <div class="face back">
        <div class="mark">?</div>
        <div class="hint">ketuk untuk membalik</div>
      </div>
      <div class="face front" id="cardFront">
        <div class="deck-label" id="frontDeckLabel"></div>
        <div class="wild" id="frontWild" hidden></div>
        <div class="question" id="frontQuestion"></div>
        <div class="followup" id="frontFollow" hidden></div>
        <div class="num" id="frontNum"></div>
      </div>
    </div>
  </div>
  <button class="primary" id="drawBtn" type="button">Kocok &amp; Ambil Kartu</button>
  <div class="count" id="count"></div>
</section>

<script>
/* =====================================================================
   DATA — semua konten ada di sini. Kode di bawah membaca data ini.

   Alurnya dua langkah: pilih kategori (sama siapa), lalu pilih dek.

   Cara menambah:
   • Kategori baru (sama siapa)  → tambah satu objek di AUDIENCES.
                                   solo:true = sendirian (tanpa wildcard),
                                   pair:true = berdua (tanpa wildcard grup).
   • Dek khusus satu kategori    → tambah { name, color, depth, desc, cards }
                                   di decks kategori itu.
   • Dek umum (lintas kategori)  → tambah di SHARED_DECKS. Isi for:['id', ...]
                                   untuk membatasi ke kategori tertentu, atau
                                   hapus for supaya muncul di semua kategori.
   • depth                       → 'ringan' atau 'dalam'. Dek 'dalam' otomatis
                                   dapat pertanyaan lanjutan.
   • tag (opsional)              → label pendek, mis. 'Game · 3+ orang'.
   • Warna                       → pakai nama dari PALETTE.
   ===================================================================== */

const PALETTE = {
  sage:'#6B8F71', clay:'#8A5A44', amber:'#C97B3D', blue:'#4A6FA5',
  plum:'#7D6B94', brick:'#B0524A', teal:'#3E8E8A', gold:'#B98B2E'
};

const TEXT = {
  homeTagline: 'Mau ngobrol sama siapa?',
  deckTagline: name => name + ' — pilih dek untuk mulai.',
  ownDecks: name => 'Khusus ' + name,
  sharedDecks: 'Topik umum',
  allDepths: 'Semua',
  depths: { ringan:'Ringan', dalam:'Dalam' },
  deckCount: (own, shared) => own + ' dek khusus · ' + shared + ' topik umum',
  cardCount: n => n + ' kartu',
  noDecks: 'Belum ada dek dengan kedalaman ini.',
  remaining: n => n + ' kartu tersisa di dek ini',
  empty: 'Semua kartu di dek ini sudah diambil. Ambil lagi untuk kocok ulang.',
  wildcardTitle: 'Wildcard',
  followUpPrefix: 'Lanjutan: '
};

/* Wildcard: kadang kartu dapat twist. Tidak muncul di kategori solo:true;
   kategori pair:true hanya dapat WILDCARDS, tanpa GROUP_WILDCARDS. */
const WILDCARD_CHANCE = 1/6;
const WILDCARDS = [
  'Semua orang jawab pertanyaan ini.',
  'Orang lain tebak jawabanmu dulu, baru kamu jawab.'
];
const GROUP_WILDCARDS = [
  'Pilih satu orang untuk jawab pertanyaan ini.',
  'Orang di sebelah kirimu jawab untukmu, lalu kamu koreksi.',
  'Jawab, lalu lempar pertanyaan yang sama ke orang pilihanmu.'
];

/* Pertanyaan lanjutan untuk dek depth:'dalam'. Satu kartu bisa punya lanjutan sendiri:
   tulis kartunya sebagai { q:'Pertanyaan?', follow:'Lanjutan?' }. */
const FOLLOW_UPS = [
  'Kenapa?',
  'Ceritain satu contohnya.',
  'Sejak kapan kamu ngerasa gitu?',
  'Apa yang bisa bikin itu berubah?',
  'Gimana perasaanmu waktu itu?',
  'Apa artinya itu buat kamu sekarang?'

/* =====================================================================
   APP — tidak perlu diubah saat menambah konten.
   ===================================================================== */

const color = name => PALETTE[name] || name || PALETTE.sage;
const $ = id => document.getElementById(id);

const ui = {
  tagline: $('tagline'), home: $('homeScreen'), deckScreen: $('deckScreen'), playScreen: $('playScreen'),
  audienceGrid: $('audienceGrid'), depthFilter: $('depthFilter'), deckList: $('deckList'), crumb: $('crumb'),
  card: $('card'), cardFront: $('cardFront'), frontLabel: $('frontDeckLabel'),
  frontQuestion: $('frontQuestion'), frontNum: $('frontNum'),
  frontWild: $('frontWild'), frontFollow: $('frontFollow'),
  count: $('count'), drawBtn: $('drawBtn'), homeBtn: $('homeBtn'), decksBtn: $('decksBtn')
};

const state = { audience:null, depth:'semua', deck:null };
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
/* A card is either 'Pertanyaan?' or { q:'Pertanyaan?', follow:'Lanjutan?' }. */
const cardText = c => typeof c === 'string' ? c : c.q;
const cardFollow = c => typeof c === 'string' ? null : (c.follow || null);
const isDeep = deck => deck.depth === 'dalam';

/* Draw pile per deck object, so any deck from any source just works. */
const pools = new Map();
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function poolFor(deck){
  if(!pools.has(deck) || pools.get(deck).length===0) pools.set(deck, shuffle([...deck.cards.keys()]));
  return pools.get(deck);
}
function remaining(deck){ return pools.has(deck) ? pools.get(deck).length : deck.cards.length; }

const sharedDecksFor = audience => SHARED_DECKS.filter(d => !d.for || d.for.includes(audience.id));

function button(className, text, onClick){
  const b = document.createElement('button');
  b.type = 'button'; b.className = className; b.textContent = text;
  b.addEventListener('click', onClick);
  return b;
}
function el(className, text){
  const d = document.createElement('div');
  d.className = className; d.textContent = text;
  return d;
}

function showScreen(name){
  ui.home.hidden = name !== 'home';
  ui.deckScreen.hidden = name !== 'decks';
  ui.playScreen.hidden = name !== 'play';
  window.scrollTo(0, 0);
}

/* ---------- Screens ---------- */

function renderHome(){
  ui.audienceGrid.replaceChildren(...AUDIENCES.map(a => {
    const b = button('cat-card', '', () => openAudience(a));
    b.style.setProperty('--cat-color', color(a.color));
    b.append(el('cat-title', a.name), el('cat-desc', a.desc),
             el('cat-meta', TEXT.deckCount(a.decks.length, sharedDecksFor(a).length)));
    return b;
  }));
}

function goHome(){
  showScreen('home');
  ui.tagline.textContent = TEXT.homeTagline;
}

function openAudience(audience){
  if(state.audience !== audience) state.depth = 'semua';
  state.audience = audience;
  renderDeckList();
  showScreen('decks');
  ui.tagline.textContent = TEXT.deckTagline(audience.name);
}

function renderDepthFilter(){
  const options = [['semua', TEXT.allDepths], ...Object.entries(TEXT.depths)];
  ui.depthFilter.replaceChildren(...options.map(([id, label]) => {
    const b = button('tier-btn', label, () => { state.depth = id; renderDeckList(); });
    b.dataset.active = String(state.depth === id);
    b.setAttribute('aria-pressed', String(state.depth === id));
    return b;
  }));
}

function deckCard(deck){
  const b = button('deck-card', '', () => openDeck(deck));
  b.style.setProperty('--deck-color', color(deck.color));
  const head = el('deck-head', '');
  head.append(el('deck-name', deck.name), el('deck-count', TEXT.cardCount(deck.cards.length)));
  const meta = el('deck-meta', '');
  meta.append(el('badge ' + deck.depth, TEXT.depths[deck.depth] || deck.depth));
  if(deck.tag) meta.append(el('badge tag', deck.tag));
  b.append(head, el('deck-desc', deck.desc || ''), meta);
  return b;
}

function renderDeckList(){
  renderDepthFilter();
  const a = state.audience;
  const match = d => state.depth === 'semua' || d.depth === state.depth;
  const groups = [[TEXT.ownDecks(a.name), a.decks], [TEXT.sharedDecks, sharedDecksFor(a)]];
  const parts = [];
  groups.forEach(([label, decks]) => {
    const shown = decks.filter(match);
    if(!shown.length) return;
    parts.push(el('group-label', label), ...shown.map(deckCard));
  });
  if(!parts.length) parts.push(el('group-label', TEXT.noDecks));
  ui.deckList.replaceChildren(...parts);
}

function openDeck(deck){
  state.deck = deck;
  const c = color(deck.color);
  document.documentElement.style.setProperty('--accent', c);
  ui.cardFront.style.setProperty('--deck-color', c);
  const name = document.createElement('b');
  name.textContent = deck.name;
  ui.crumb.replaceChildren(state.audience.name + ' · ' + (TEXT.depths[deck.depth] || deck.depth) + ' · ', name);
  ui.tagline.textContent = deck.desc || '';
  ui.card.dataset.flipped = 'false';
  ui.frontQuestion.textContent = '';
  ui.frontWild.hidden = true;
  ui.frontFollow.hidden = true;
  updateCount();
  showScreen('play');
}

function backToDecks(){
  showScreen('decks');
  ui.tagline.textContent = TEXT.deckTagline(state.audience.name);
}

/* ---------- Card ---------- */

function updateCount(){
  const n = remaining(state.deck);
  ui.count.textContent = n > 0 ? TEXT.remaining(n) : TEXT.empty;
}

function drawCard(){
  const deck = state.deck;
  const idx = poolFor(deck).pop();
  const c = deck.cards[idx];
  ui.frontQuestion.textContent = cardText(c);
  ui.frontLabel.textContent = deck.name;

  const follow = cardFollow(c) || (isDeep(deck) ? pick(FOLLOW_UPS) : null);
  ui.frontFollow.hidden = !follow;
  ui.frontFollow.textContent = follow ? TEXT.followUpPrefix + follow : '';

  const wildcards = state.audience.pair ? WILDCARDS : WILDCARDS.concat(GROUP_WILDCARDS);
  const wild = !state.audience.solo && wildcards.length && Math.random() < WILDCARD_CHANCE;
  ui.frontWild.hidden = !wild;
  if(wild){
    ui.frontWild.innerHTML = '<b></b><span></span>';
    ui.frontWild.querySelector('b').textContent = TEXT.wildcardTitle;
    ui.frontWild.querySelector('span').textContent = pick(wildcards);
  }
  ui.frontNum.textContent = (idx + 1) + ' / ' + deck.cards.length;
  ui.card.dataset.flipped = 'false';
  requestAnimationFrame(() => requestAnimationFrame(() => { ui.card.dataset.flipped = 'true'; }));
  updateCount();
}

function flipCard(){
  if(!ui.frontQuestion.textContent){ drawCard(); return; }
  ui.card.dataset.flipped = ui.card.dataset.flipped === 'true' ? 'false' : 'true';
}

ui.card.addEventListener('click', flipCard);
ui.card.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); flipCard(); } });
ui.drawBtn.addEventListener('click', drawCard);
ui.homeBtn.addEventListener('click', goHome);
ui.decksBtn.addEventListener('click', backToDecks);

/* Warn in the console about data mistakes instead of failing silently. */
(function checkData(){
  const audienceIds = new Set(AUDIENCES.map(a => a.id));
  const check = (d, where) => {
    if(!(d.depth in TEXT.depths)) console.warn('Dek "' + d.name + '" di ' + where + ' pakai depth tidak dikenal: ' + d.depth);
    if(!d.desc) console.warn('Dek "' + d.name + '" di ' + where + ' belum punya desc.');
    if(!d.cards || !d.cards.length) console.warn('Dek "' + d.name + '" di ' + where + ' belum punya kartu.');
  };
  AUDIENCES.forEach(a => a.decks.forEach(d => check(d, a.name)));
  SHARED_DECKS.forEach(d => {
    check(d, 'topik umum');
    (d.for || []).forEach(id => { if(!audienceIds.has(id)) console.warn('Dek "' + d.name + '" pakai kategori tidak dikenal di for: ' + id); });
  });
})();

renderHome();
goHome();
</script>
